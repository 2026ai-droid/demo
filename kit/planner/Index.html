<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계획–집중–성찰 플래너</title>
<style>
  :root{--bg:#f3f5f9;--card:#fff;--ink:#16233a;--muted:#55627a;--line:#d6dde8;--navy:#1f3a68;--gold:#e3a72f;--a:#2563c9;--i:#178a55;--d:#7a3fd1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .preview{background:#fff6e2;color:#5b4206;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .step{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
  .dot{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  input,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:64px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
  .timer{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--navy);color:#fff}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.gold{background:var(--gold);color:#2a1c00}
  button:disabled{opacity:.45;cursor:default}
  .msg{min-height:22px;font-size:13.5px;margin:6px 0}
  .err{color:#b4462f}.ok{color:var(--i)}
  ul.hist{list-style:none;margin:0;padding:0}
  ul.hist li{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
  ul.hist li:first-child{border-top:0}
  .when{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<main>
  <h1>계획–집중–성찰 플래너</h1>
  <p class="sub">오늘 할 공부를 정하고, 집중해서 하고, 돌아본 뒤 다음 계획을 세워요.</p>
  <div class="preview" id="preview" hidden>미리보기 화면입니다. 입력한 내용은 이 창에만 잠시 남고 저장되지 않아요.</div>

  <section class="card">
    <div class="row">
      <div><label for="cls">반</label><input id="cls" inputmode="numeric" placeholder="예: 3"></div>
      <div><label for="no">번호</label><input id="no" inputmode="numeric" placeholder="예: 12"></div>
      <div><label for="nick">별칭</label><input id="nick" placeholder="나만 아는 말"></div>
    </div>
  </section>

  <section class="card">
    <div class="step"><span class="dot" style="background:var(--a)">1</span>계획</div>
    <label for="plan">오늘 할 공부</label>
    <textarea id="plan" placeholder="예: 수학 교과서 52~55쪽 문제 풀고 틀린 문제 다시 보기"></textarea>
    <label for="goal">끝났을 때 이렇게 되어 있으면 성공</label>
    <input id="goal" placeholder="예: 틀린 문제를 친구에게 설명할 수 있다">
  </section>

  <section class="card">
    <div class="step"><span class="dot" style="background:var(--i)">2</span>집중</div>
    <div class="timer" id="clock">00:00</div>
    <div class="btns" style="justify-content:center">
      <button id="startBtn" class="gold">집중 시작</button>
      <button id="stopBtn" class="ghost" disabled>멈춤</button>
    </div>
  </section>

  <section class="card">
    <div class="step"><span class="dot" style="background:var(--d)">3</span>성찰</div>
    <label for="good">잘된 점</label><textarea id="good"></textarea>
    <label for="hard">어려웠던 점과 그 이유</label><textarea id="hard"></textarea>
    <label for="next">다음에 이렇게 해 볼래요</label><textarea id="next"></textarea>
    <div class="msg" id="msg" role="status"></div>
    <button id="saveBtn">저장하기</button>
  </section>

  <section class="card">
    <div class="step">나의 최근 기록</div>
    <ul class="hist" id="hist"><li class="when">아직 기록이 없어요.</li></ul>
  </section>
</main>

<script>
/* Apps Script 안에서는 서버 함수를, 그냥 열었을 때는 미리보기용 가짜 저장소를 씁니다. */
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var MOCK = {
  rows: [],
  saveRecord: function (r) {
    if (!r.cls || !r.no || !r.nick) throw new Error('반, 번호, 별칭을 모두 입력하세요.');
    if (!r.plan) throw new Error('오늘의 계획을 먼저 적어 주세요.');
    this.rows.push({ at: new Date(), cls: r.cls, no: r.no, nick: r.nick, plan: r.plan, minutes: r.minutes, next: r.next });
    return this.getMyRecords(r.cls, r.no, r.nick);
  },
  getMyRecords: function (c, n, k) {
    return this.rows.filter(function (x) { return x.cls === c && x.no === n && x.nick === k; })
      .slice(-5).reverse().map(function (x) {
        var d = x.at; return { at: (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.toTimeString().slice(0, 5), plan: x.plan, minutes: x.minutes, next: x.next };
      });
  }
};
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (IS_GAS) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    } else {
      try { resolve(MOCK[fn].apply(MOCK, args)); } catch (e) { reject(e); }
    }
  });
}

var $ = function (id) { return document.getElementById(id); };
if (!IS_GAS) $('preview').hidden = false;

var started = null, total = 0, tick = null;
function show() {
  var sec = total + (started ? Math.floor((Date.now() - started) / 1000) : 0);
  $('clock').textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}
$('startBtn').onclick = function () {
  started = Date.now(); tick = setInterval(show, 500);
  $('startBtn').disabled = true; $('stopBtn').disabled = false;
};
$('stopBtn').onclick = function () {
  total += Math.floor((Date.now() - started) / 1000); started = null; clearInterval(tick); show();
  $('startBtn').disabled = false; $('stopBtn').disabled = true; $('startBtn').textContent = '이어서 집중';
};

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function render(list) {
  $('hist').innerHTML = list.length ? list.map(function (x) {
    return '<li><div class="when">' + esc(x.at) + ' · 집중 ' + esc(x.minutes) + '분</div>' + esc(x.plan) +
      (x.next ? '<div class="when">다음: ' + esc(x.next) + '</div>' : '') + '</li>';
  }).join('') : '<li class="when">아직 기록이 없어요.</li>';
}

$('saveBtn').onclick = function () {
  if (started) $('stopBtn').onclick();
  var v = function (id) { return $(id).value.trim(); };
  var rec = { cls: v('cls'), no: v('no'), nick: v('nick'), plan: v('plan'), goal: v('goal'),
              minutes: Math.round(total / 60), good: v('good'), hard: v('hard'), next: v('next') };
  $('saveBtn').disabled = true; $('msg').className = 'msg'; $('msg').textContent = '저장하는 중…';
  call('saveRecord', rec).then(function (list) {
    render(list); $('msg').className = 'msg ok'; $('msg').textContent = '저장했어요. 다음 계획을 기억해 두세요!';
    ['plan', 'goal', 'good', 'hard'].forEach(function (id) { $(id).value = ''; });
    $('plan').value = rec.next; $('next').value = ''; total = 0; show();
    $('startBtn').textContent = '집중 시작';
  }).catch(function (e) {
    $('msg').className = 'msg err'; $('msg').textContent = (e && e.message) || '저장하지 못했어요.';
  }).then(function () { $('saveBtn').disabled = false; });
};
</script>
</body>
</html>
