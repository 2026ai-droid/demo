<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>먼저 생각하고 AI와 비교하기</title>
<style>
  :root{--bg:#f3f5f9;--card:#fff;--ink:#16233a;--muted:#55627a;--line:#d6dde8;--navy:#1f3a68;--gold:#e3a72f;--a:#2563c9;--i:#178a55;--d:#7a3fd1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
  main{max-width:620px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .preview{background:#fff6e2;color:#5b4206;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .step{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
  .dot{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  input,textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  textarea[readonly]{background:#f6f8fb}
  .row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
  .q{font-weight:600;background:#eef2f8;border-radius:10px;padding:10px 12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;min-height:84px}
  .box h4{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
  .ai{border-color:#c9b6ef;background:#f7f3fe}
  .choices{display:grid;gap:6px}
  .choices label{display:flex;gap:8px;align-items:center;margin:0;color:var(--ink);font-size:14.5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
  .choices input{width:auto}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--navy);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  .msg{min-height:22px;font-size:13.5px;margin:6px 0}
  .err{color:#b4462f}.ok{color:var(--i)}
  .locked{opacity:.5;pointer-events:none}
  @media (max-width:520px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>먼저 생각하고, AI와 비교하기</h1>
  <p class="sub">내 생각을 먼저 저장해야 AI의 답이 열려요. AI의 답이 맞는지도 꼭 따져 보세요.</p>
  <div class="preview" id="preview" hidden>미리보기 화면입니다. 입력한 내용은 저장되지 않아요.</div>

  <section class="card">
    <div class="row">
      <div><label for="cls">반</label><input id="cls" inputmode="numeric" placeholder="예: 3"></div>
      <div><label for="no">번호</label><input id="no" inputmode="numeric" placeholder="예: 12"></div>
      <div><label for="nick">별칭</label><input id="nick" placeholder="나만 아는 말"></div>
    </div>
    <label for="qsel">질문</label>
    <select id="qsel"></select>
    <p class="q" id="qtext"></p>
  </section>

  <section class="card" id="s1">
    <div class="step"><span class="dot" style="background:var(--i)">I</span>내 생각 먼저</div>
    <label for="first">예측이나 답, 그렇게 생각한 이유</label>
    <textarea id="first" placeholder="AI를 보기 전에 내 생각을 써요."></textarea>
    <div class="msg" id="msg1" role="status"></div>
    <button id="firstBtn">내 생각 저장하고 AI 답 보기</button>
  </section>

  <section class="card locked" id="s2" aria-disabled="true">
    <div class="step"><span class="dot" style="background:var(--d)">D</span>비교하고 고치기</div>
    <div class="two">
      <div class="box"><h4>내가 처음 쓴 생각</h4><div id="mine"></div></div>
      <div class="box ai"><h4>AI 참고 답변</h4><div id="ai"></div></div>
    </div>
    <label>AI 답을 보고 나는…</label>
    <div class="choices" id="choices"></div>
    <label for="final">나의 최종 생각</label>
    <textarea id="final"></textarea>
    <label for="reason">그렇게 정한 이유 (AI 답에서 맞는 점, 틀리거나 빠진 점)</label>
    <textarea id="reason"></textarea>
    <div class="msg" id="msg2" role="status"></div>
    <button id="finalBtn">최종 생각 저장</button>
  </section>
</main>

<script>
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var CHOICES = ['그대로 둠(KEEP)', '일부 가져와 씀(USE)', '내 생각을 고침(CHANGE)'];
var MOCK = {
  q: [{ id: 'Q1', text: '압력이 일정할 때 기체의 온도를 높이면 부피는 어떻게 될까요? 이유와 함께 예측해 보세요.',
        ai: '기체의 부피는 온도에 비례합니다. 그래서 온도가 10℃에서 20℃로 2배가 되면 부피도 항상 2배가 됩니다.' }],
  saved: {},
  getQuestions: function () { return this.q.map(function (x) { return { id: x.id, text: x.text }; }); },
  saveFirst: function (p) {
    if (!p.cls || !p.no || !p.nick) throw new Error('반, 번호, 별칭을 모두 입력하세요.');
    if ((p.first || '').length < 10) throw new Error('내 생각을 조금 더 자세히 써 주세요(10자 이상).');
    var k = [p.cls, p.no, p.nick, p.qid].join('|');
    if (!this.saved[k]) this.saved[k] = p.first;
    var q = this.q.filter(function (x) { return x.id === p.qid; })[0];
    return { ai: q.ai, first: this.saved[k] };
  },
  saveFinal: function (p) {
    if (CHOICES.indexOf(p.choice) < 0) throw new Error('세 가지 중 하나를 골라 주세요.');
    if ((p.reason || '').length < 5) throw new Error('왜 그렇게 정했는지 이유를 써 주세요.');
    return true;
  }
};
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (IS_GAS) { var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject); r[fn].apply(r, args); }
    else { try { resolve(MOCK[fn].apply(MOCK, args)); } catch (e) { reject(e); } }
  });
}
var $ = function (id) { return document.getElementById(id); };
if (!IS_GAS) $('preview').hidden = false;

var QS = [];
$('choices').innerHTML = CHOICES.map(function (c, i) {
  return '<label><input type="radio" name="choice" value="' + c + '"' + (i === 0 ? '' : '') + '> ' + c + '</label>';
}).join('');
call('getQuestions').then(function (qs) {
  QS = qs;
  $('qsel').innerHTML = qs.map(function (q) { return '<option value="' + q.id + '">' + q.id + '</option>'; }).join('');
  $('qtext').textContent = qs.length ? qs[0].text : '지금 열린 질문이 없어요.';
});
$('qsel').onchange = function () {
  var q = QS.filter(function (x) { return x.id === $('qsel').value; })[0];
  $('qtext').textContent = q ? q.text : '';
  $('s2').classList.add('locked'); $('first').readOnly = false; $('firstBtn').disabled = false;
};
function who() { return { cls: $('cls').value.trim(), no: $('no').value.trim(), nick: $('nick').value.trim(), qid: $('qsel').value }; }
function say(el, ok, t) { el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = t; }

$('firstBtn').onclick = function () {
  var p = who(); p.first = $('first').value.trim();
  $('firstBtn').disabled = true;
  call('saveFirst', p).then(function (r) {
    $('first').value = r.first; $('first').readOnly = true;
    $('mine').textContent = r.first; $('ai').textContent = r.ai; $('final').value = r.first;
    $('s2').classList.remove('locked'); $('s2').removeAttribute('aria-disabled');
    say($('msg1'), true, '내 생각을 저장했어요. 이제 AI 답과 비교해 보세요.');
  }).catch(function (e) { $('firstBtn').disabled = false; say($('msg1'), false, (e && e.message) || '저장하지 못했어요.'); });
};
$('finalBtn').onclick = function () {
  var p = who(); var c = document.querySelector('input[name=choice]:checked');
  p.choice = c ? c.value : ''; p.final = $('final').value.trim(); p.reason = $('reason').value.trim();
  $('finalBtn').disabled = true;
  call('saveFinal', p).then(function () { say($('msg2'), true, '최종 생각을 저장했어요. 다시 고치면 덮어써요.'); })
    .catch(function (e) { say($('msg2'), false, (e && e.message) || '저장하지 못했어요.'); })
    .then(function () { $('finalBtn').disabled = false; });
};
</script>
</body>
</html>
